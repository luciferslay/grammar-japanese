<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>女声对比：原女声 / Ono_Anna 第一版 / 第二版</title>
<style>body{font-family:system-ui,sans-serif;max-width:860px;margin:24px auto;padding:0 16px;color:#222}h1{font-size:20px}
.row{border:1px solid #ddd;border-radius:12px;padding:12px 14px;margin:12px 0}.ja{font-size:17px;margin:0 0 4px}.zh{color:#666;font-size:13px;margin:0 0 10px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cols div{font-size:12px;color:#555}.cols div.new{color:#a33;font-weight:600}audio{width:100%;margin-top:4px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}</style></head><body>
<h1>第 1 课女声对比（第二版）</h1>
<p class="zh">每句三个版本：左 = 现在网站上的原女声；中 = Ono_Anna 第一版（你说语气夸张、有杂音）；右 = Ono_Anna 第二版（改成原女声的平稳读法 + 正式流水线切气声）。函館 已按 はこだて 读。重点听右边。</p>
<div id="list"></div>
<script>
const items=[
 ["dialogue-02","いいえ、一度もありません。写真を見せてください。","课文 · 对话 2"],
 ["dialogue-04","いいですね。私は函館のラーメンなら食べたことがありますよ。","课文 · 对话 4"],
 ["lesson-02-term","見せる","单词"],
 ["lesson-02-example","昨日撮った写真を友達に見せました。","单词例句"],
 ["lesson-03-term","こんなに","单词"],
 ["lesson-03-example","こんなに寒い日は初めてです。","单词例句"]];
const a=(src)=>`<audio controls preload="none" src="${src}"></audio>`;
document.getElementById('list').innerHTML=items.map(([f,ja,kind])=>`<div class="row"><p class="ja">${ja}</p><p class="zh">${kind}</p><div class="cols">
<div>原女声${a('/audio/standard/gj-01/'+f+'.m4a')}</div>
<div>Ono_Anna 第一版${f==='dialogue-04'||f.startsWith('lesson-')||f==='dialogue-02'?a('/audio/samples/ono-anna/'+f+'.m4a'):'（没录）'}</div>
<div class="new">Ono_Anna 第二版${a('/audio/samples/ono-anna-v2/'+f+'.m4a')}</div></div></div>`).join('');
</script></body></html>
